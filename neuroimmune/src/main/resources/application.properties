# 服务器端口
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/neuroimmune?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Plus 配置
mybatis-plus.mapper-locations=classpath:mappers/*xml
mybatis-plus.type-aliases-package=org.hospital.neuroimmune.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Thymeleaf 配置
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.content-type=text/html
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML5
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JSON 日期格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# 日志级别
logging.level.org.hospital.neuroimmune=DEBUG

# 阿里云OCR配置
aliyun.ocr.access-key-id=your-access-key-id
aliyun.ocr.access-key-secret=your-access-key-secret
aliyun.ocr.endpoint=ocr-api.cn-hangzhou.aliyuncs.com