# 服务器端口
server:
  port: 8080

# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/neuroimmune?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Thymeleaf 配置
  thymeleaf:
    cache: false
    check-template: true
    check-template-location: true
    content-type: text/html
    enabled: true
    encoding: UTF-8
    mode: HTML5
    prefix: classpath:/templates/
    suffix: .html

  # JSON 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:mappers/*xml
  type-aliases-package: org.hospital.neuroimmune.entity
  configuration:
    map-underscore-to-camel-case: true

# 日志级别
logging:
  level:
    org.hospital.neuroimmune: DEBUG

# 阿里云OCR配置
aliyun:
  ocr:
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    endpoint: ocr-api.cn-hangzhou.aliyuncs.com

# MinIO 配置
minio:
  endpoint: http://101.201.30.29:9100
  access-key: Abc123456
  secret-key: Abc123456
  bucket-name: neuroimmune

# OCR API 配置（调用百度OCR API服务）
ocr:
  api:
    base-url: http://localhost:8081/api/ocr
    timeout: 60000

# 文件上传路径（备用）
file:
  upload:
    path: ./uploads