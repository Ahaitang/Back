server:
  port: 8080

spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  cache:
    type: redis

# JWT 认证配置
jwt:
  secret: ${JWT_SECRET:hospital-platform-jwt-secret-key-2024-secure}
  expiration: ${JWT_EXPIRATION:86400000}  # 默认24小时（毫秒）

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.hospital: DEBUG

# 超级管理员配置
super-admin:
  accounts:
    - username: admin
      password: ${SUPER_ADMIN_PASSWORD:}
      name: 超级管理员