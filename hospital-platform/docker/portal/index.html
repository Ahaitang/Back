<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院信息系统 - 门户导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .card-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
        }

        .card-qmg .card-icon {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .card-neuroimmune .card-icon {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .card-super-admin .card-icon {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .card h3 {
            color: #333;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .card-btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .card-qmg .card-btn {
            background: #4facfe;
            color: #fff;
        }

        .card-neuroimmune .card-btn {
            background: #fa709a;
            color: #fff;
        }

        .card-super-admin .card-btn {
            background: #667eea;
            color: #fff;
        }

        .card-btn:hover {
            opacity: 0.9;
            padding: 12px 36px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.offline {
            background: #f87171;
        }

        .status-text {
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 医院信息系统</h1>
            <p>神经免疫疾病随访与重症肌无力评分管理平台</p>
        </div>

        <div class="cards">
            <!-- QMG 系统 -->
            <div class="card card-qmg" onclick="location.href='/qmg-admin/'">
                <div class="card-icon">💪</div>
                <h3>重症肌无力评分系统</h3>
                <p>QMG 定量评分管理<br>患者信息管理<br>问卷记录统计分析</p>
                <a href="/qmg-admin/" class="card-btn">进入系统</a>
                <div class="status">
                    <span class="status-dot" id="qmg-status"></span>
                    <span class="status-text">系统状态检测中...</span>
                </div>
            </div>

            <!-- Neuroimmune 系统 -->
            <div class="card card-neuroimmune" onclick="location.href='/neuroimmune-admin/'">
                <div class="card-icon">🧠</div>
                <h3>神经免疫随访系统</h3>
                <p>多发性硬化等疾病随访<br>用药记录管理<br>病历档案管理</p>
                <a href="/neuroimmune-admin/" class="card-btn">进入系统</a>
                <div class="status">
                    <span class="status-dot" id="neuro-status"></span>
                    <span class="status-text">系统状态检测中...</span>
                </div>
            </div>

            <!-- 超级管理员 -->
            <div class="card card-super-admin" onclick="location.href='/super-admin/'">
                <div class="card-icon">🔐</div>
                <h3>超级管理员平台</h3>
                <p>用户在线管理<br>会话审计日志<br>系统配置管理</p>
                <a href="/super-admin/" class="card-btn">进入系统</a>
                <div class="status">
                    <span class="status-dot" id="admin-status"></span>
                    <span class="status-text">系统状态检测中...</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 医院信息系统 | 技术支持</p>
        </div>
    </div>

    <script>
        // 检测各系统状态
        function checkStatus(url, elementId) {
            const dot = document.getElementById(elementId);
            const text = dot.nextElementSibling;

            fetch(url + '/actuator/health', {
                method: 'GET',
                mode: 'no-cors'
            })
            .then(() => {
                // 由于 no-cors 模式无法读取响应，我们假设请求成功即服务在线
                dot.classList.remove('offline');
                text.textContent = '服务正常运行';
            })
            .catch(() => {
                dot.classList.add('offline');
                text.textContent = '服务暂时离线';
            });
        }

        // 页面加载后检测状态
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                checkStatus('/api/v1', 'qmg-status');
                checkStatus('/api/v1', 'neuro-status');
                checkStatus('/api/v1', 'admin-status');
            }, 500);
        });
    </script>
</body>
</html>
