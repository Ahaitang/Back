# ============================================
# Nginx 反向代理配置（可选）
# 用于统一入口访问所有服务
# ============================================

upstream backend {
    server backend:8080;
}

upstream qmg_admin {
    server qmg-admin:80;
}

upstream neuroimmune_admin {
    server neuroimmune-admin:80;
}

server {
    listen 80;
    server_name your-domain.com;

    # 重定向到 HTTPS (可选)
    # return 301 https://$server_name$request_uri;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_comp_level 6;

    # ============================================
    # API 反向代理 -> 后端服务
    # ============================================
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ============================================
    # QMG Admin -> http://your-domain.com/qmg-admin/
    # ============================================
    location /qmg-admin/ {
        proxy_pass http://qmg_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Neuroimmune Admin -> http://your-domain.com/neuroimmune-admin/
    # ============================================
    location /neuroimmune-admin/ {
        proxy_pass http://neuroimmune_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 健康检查
    # ============================================
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

