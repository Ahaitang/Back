# ============================================
# Nginx Gateway Docker Compose
# 用于统一入口访问所有服务
# ============================================

services:
  nginx-gateway:
    image: nginx:alpine
    container_name: hospital-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
      # - "${GATEWAY_HTTPS_PORT:-443}:443"  # HTTPS 端口
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro     # SSL 证书目录
    depends_on:
      - backend
      - qmg-admin
      - neuroimmune-admin
    networks:
      - hospital-network