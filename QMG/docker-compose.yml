version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qmg-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: qmg_db
      MYSQL_USER: qmg_user
      MYSQL_PASSWORD: qmg123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - qmg-network

volumes:
  mysql_data:
    driver: local

networks:
  qmg-network:
    driver: bridge
